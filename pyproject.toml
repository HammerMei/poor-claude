[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poor-claude"
version = "0.1.0"
description = "POC for routing claude-no-p prompts through persistent Claude Code sessions."
requires-python = ">=3.11"

[project.scripts]
claude-no-p = "poor_claude.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poor_claude*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
