[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poor-claude"
version = "0.2.0"
description = "Drop-in replacement for `claude -p` that routes prompts through persistent interactive Claude Code sessions, keeping usage under your subscription."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["claude", "claude-code", "anthropic", "ai", "cli"]

[project.scripts]
claude-no-p = "poor_claude.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poor_claude*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
